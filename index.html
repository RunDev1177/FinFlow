<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกรายรับ-รายจ่าย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="financialicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .data-card { transition: all 0.3s ease; }
        .data-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .filter-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">บันทึกรายรับ-รายจ่าย</h1>
                <p class="text-slate-500">จัดการกระเป๋าเงินส่วนตัวและธุรกิจของคุณ</p>
            </div>
            <div class="flex flex-col gap-3 w-full md:w-auto">
                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    <!-- Dropdown เลือกเดือน -->
                    <select id="monthFilter" onchange="renderTable()" class="flex-1 md:flex-none bg-white border border-slate-300 text-slate-700 px-4 py-2.5 rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer font-medium">
                        <option value="all">ทุกช่วงเวลา</option>
                        <!-- ตัวเลือกเดือนจะถูกสร้างด้วย JS -->
                    </select>

                    <button onclick="fetchData()" class="flex-1 md:flex-none bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-4 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center">
                        <i class="fas fa-sync-alt mr-2"></i> รีเฟรช
                    </button>
                    <button onclick="openModal()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl shadow-md transition flex items-center justify-center font-bold">
                        <i class="fas fa-plus mr-2"></i> เพิ่มรายการ
                    </button>
                </div>
                <!-- ปุ่มเลือกกระเป๋า (Filter) -->
                <div class="flex bg-slate-200 p-1 rounded-xl gap-1">
                    <button onclick="setFilter('all')" id="filter-all" class="filter-btn active flex-1 text-xs font-bold py-2 rounded-lg transition-all">ทั้งหมด</button>
                    <button onclick="setFilter('ส่วนตัว')" id="filter-personal" class="filter-btn flex-1 text-xs font-bold py-2 rounded-lg transition-all text-slate-600 bg-transparent">ส่วนตัว</button>
                    <button onclick="setFilter('ธุรกิจ')" id="filter-business" class="filter-btn flex-1 text-xs font-bold py-2 rounded-lg transition-all text-slate-600 bg-transparent">ธุรกิจ</button>
                </div>
            </div>
        </header>

        <!-- แผงสรุปยอด -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 text-center md:text-left">
            <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-green-500 data-card">
                <p class="text-slate-500 text-sm font-semibold mb-1">รายรับรวม <span id="summaryLabel" class="text-xs text-blue-500">(ทั้งหมด)</span></p>
                <h2 id="totalIncome" class="text-3xl font-bold text-green-600">0.00 ฿</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-red-500 data-card">
                <p class="text-slate-500 text-sm font-semibold mb-1">รายจ่ายรวม</p>
                <h2 id="totalExpense" class="text-3xl font-bold text-red-600">0.00 ฿</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-blue-500 data-card">
                <p class="text-slate-500 text-sm font-semibold mb-1">ยอดเงินคงเหลือ</p>
                <h2 id="totalBalance" class="text-3xl font-bold text-blue-600">0.00 ฿</h2>
            </div>
        </div>

        <!-- ส่วนของตาราง -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-500 uppercase text-xs font-bold border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4">วันที่</th>
                            <th class="px-6 py-4">รายการ / หมายเหตุ</th>
                            <th class="px-6 py-4 text-center">ประเภท</th>
                            <th class="px-6 py-4 text-right">จำนวนเงิน</th>
                            <th class="px-6 py-4">กระเป๋า</th>
                            <th class="px-6 py-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y divide-slate-100 text-slate-700">
                        <!-- รายการข้อมูลจะมาแสดงตรงนี้ -->
                    </tbody>
                </table>
            </div>
            
            <!-- สถานะการโหลด -->
            <div id="loading" class="p-20 text-center text-slate-400">
                <i class="fas fa-circle-notch fa-spin fa-3x mb-4 text-blue-500"></i>
                <p class="text-lg">กำลังดึงข้อมูล...</p>
            </div>
            
            <!-- สถานะเมื่อไม่มีข้อมูล -->
            <div id="emptyState" class="p-20 text-center text-slate-400 hidden">
                <i class="fas fa-folder-open fa-3x mb-4 text-slate-200"></i>
                <p class="text-lg">ไม่พบข้อมูลในช่วงเวลาที่เลือก</p>
                <button onclick="openModal()" class="mt-4 text-blue-500 hover:underline">เพิ่มรายการแรกของคุณ</button>
            </div>
        </div>
    </div>

    <!-- Modal ฟอร์ม -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl transition-all scale-95 duration-200">
            <div class="bg-slate-800 p-5 text-white flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-xl">เพิ่มรายการใหม่</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            <form id="expenseForm" class="p-6 space-y-5">
                <input type="hidden" id="editId">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">วันที่</label>
                        <input type="date" id="date" required class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">ประเภท</label>
                        <select id="type" class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            <option value="รายรับ">รายรับ (+)</option>
                            <option value="รายจ่าย">รายจ่าย (-)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">รายการ</label>
                    <input type="text" id="name" required placeholder="เช่น เงินเดือน, ค่าที่พัก" class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">จำนวนเงิน (฿)</label>
                        <input type="number" id="amount" required step="0.01" placeholder="0.00" class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">กระเป๋า</label>
                        <select id="wallet" class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            <option value="ส่วนตัว">ส่วนตัว</option>
                            <option value="ธุรกิจ">ธุรกิจ</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">หมายเหตุ (ถ้ามี)</label>
                    <textarea id="note" class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all" rows="2"></textarea>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white py-3.5 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95">บันทึกรายการ</button>
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 py-3.5 rounded-xl font-bold hover:bg-slate-200 transition-all">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxtvAxzHznBatyWXADGxTTNhLhoyhW449uMAm75XblRw5BSN6EjHpajf_QuhUqJIBGx/exec";

        let allData = [];
        let currentFilter = 'all';

        function generateMonthOptions() {
            const select = document.getElementById('monthFilter');
            const monthNames = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            const now = new Date();
            
            for (let i = 0; i < 12; i++) {
                const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const year = date.getFullYear();
                const value = `${year}-${month}`;
                const label = `${monthNames[date.getMonth()]} ${year + 543}`;
                
                const option = document.createElement('option');
                option.value = value;
                option.innerText = label;
                
                if (i === 0) {
                    option.selected = true;
                }
                
                select.appendChild(option);
            }
        }

        async function fetchData() {
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');
            const tableBody = document.getElementById('dataTable');
            
            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');
            tableBody.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);

                allData = Array.isArray(data) ? data : [];
                renderTable();
            } catch (error) {
                console.error("Error:", error);
                tableBody.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-white', 'shadow-sm', 'text-white');
                btn.classList.add('text-slate-600', 'bg-transparent');
            });

            const activeBtn = filter === 'all' ? document.getElementById('filter-all') : 
                            filter === 'ส่วนตัว' ? document.getElementById('filter-personal') : 
                            document.getElementById('filter-business');
            
            activeBtn.classList.add('active');
            activeBtn.classList.remove('text-slate-600', 'bg-transparent');
            
            document.getElementById('summaryLabel').innerText = filter === 'all' ? '(ทั้งหมด)' : `(${filter})`;
            
            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('dataTable');
            const emptyState = document.getElementById('emptyState');
            const selectedMonth = document.getElementById('monthFilter').value;
            tableBody.innerHTML = '';
            
            let income = 0, expense = 0;

            // กรองข้อมูลตามเงื่อนไข (กระเป๋า และ เดือน)
            const filteredData = allData.filter(item => {
                const itemWallet = item['กระเป๋า'] || item['กระเป๋า(ส่วนตัว/ธุรกิจ)'] || '-';
                const itemDate = item['วันที่'] || '';
                
                const walletMatch = currentFilter === 'all' || itemWallet === currentFilter;
                const monthMatch = selectedMonth === 'all' || itemDate.startsWith(selectedMonth);
                
                return walletMatch && monthMatch;
            });

            // คำนวณยอดรวม
            filteredData.forEach(item => {
                const amount = parseFloat(item['จำนวนเงิน']) || 0;
                const type = item['ประเภท'] || item['ประเภท(รายรับ/รายจ่าย)'] || '';
                if (type === 'รายรับ') income += amount;
                else if (type === 'รายจ่าย') expense += amount;
            });

            if (filteredData.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                // แก้ไขการเรียงลำดับ: เรียงตามวันที่ (string format YYYY-MM-DD) จากมากไปน้อย
                // หากวันที่เท่ากัน ให้เรียงตาม รหัสรายการ (ID) จากมากไปน้อย เพื่อให้รายการที่เพิ่มล่าสุดอยู่บนสุด
                const sortedData = [...filteredData].sort((a, b) => {
                    const dateA = a['วันที่'] || '';
                    const dateB = b['วันที่'] || '';
                    if (dateB !== dateA) {
                        return dateB.localeCompare(dateA);
                    }
                    // ถ้าวันที่เท่ากัน ให้ใช้ ID เป็นตัวตัดสิน (ID ที่มากกว่าคือรายการที่เพิ่มทีหลัง)
                    return (b['รหัสรายการ'] || 0) - (a['รหัสรายการ'] || 0);
                });

                sortedData.forEach(item => {
                    const amount = parseFloat(item['จำนวนเงิน']) || 0;
                    const type = item['ประเภท'] || item['ประเภท(รายรับ/รายจ่าย)'] || '';
                    const name = item['รายการ'] || '-';
                    const dateStr = item['วันที่'] || '-';
                    const wallet = item['กระเป๋า'] || item['กระเป๋า(ส่วนตัว/ธุรกิจ)'] || '-';
                    const id = item['รหัสรายการ'];

                    const row = document.createElement('tr');
                    row.className = "hover:bg-blue-50/50 transition border-b border-slate-50";
                    row.innerHTML = `
                        <td class="px-6 py-4 text-sm font-medium text-slate-600">${dateStr}</td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-800">${name}</div>
                            <div class="text-xs text-slate-400 font-light">${item['หมายเหตุ'] || ''}</div>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${type === 'รายรับ' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                ${type}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right font-bold ${type === 'รายรับ' ? 'text-green-600' : 'text-red-600'}">
                            ${amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ฿
                        </td>
                        <td class="px-6 py-4">
                            <span class="text-xs bg-slate-100 px-2 py-1 rounded-lg text-slate-500 font-medium">${wallet}</span>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex justify-center gap-3">
                                <button onclick="editItem(${id})" class="text-blue-500 hover:text-blue-700 transition p-2"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteItem(${id})" class="text-red-400 hover:text-red-600 transition p-2"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            document.getElementById('totalIncome').innerText = income.toLocaleString(undefined, {minimumFractionDigits: 2}) + " ฿";
            document.getElementById('totalExpense').innerText = expense.toLocaleString(undefined, {minimumFractionDigits: 2}) + " ฿";
            document.getElementById('totalBalance').innerText = (income - expense).toLocaleString(undefined, {minimumFractionDigits: 2}) + " ฿";
        }

        function openModal(editId = null) {
            const modal = document.getElementById('modal');
            const form = document.getElementById('expenseForm');
            form.reset();
            document.getElementById('editId').value = editId || '';
            document.getElementById('modalTitle').innerText = editId ? "📝 แก้ไขรายการ" : "➕ เพิ่มรายการใหม่";
            
            if (editId) {
                const item = allData.find(d => d['รหัสรายการ'] == editId);
                if (item) {
                    document.getElementById('date').value = item['วันที่'];
                    document.getElementById('name').value = item['รายการ'];
                    document.getElementById('type').value = item['ประเภท'] || item['ประเภท(รายรับ/รายจ่าย)'];
                    document.getElementById('amount').value = item['จำนวนเงิน'];
                    document.getElementById('wallet').value = item['กระเป๋า'] || item['กระเป๋า(ส่วนตัว/ธุรกิจ)'];
                    document.getElementById('note').value = item['หมายเหตุ'];
                }
            } else {
                document.getElementById('date').valueAsDate = new Date();
                if (currentFilter !== 'all') {
                    document.getElementById('wallet').value = currentFilter;
                }
            }
            modal.classList.remove('hidden');
            setTimeout(() => { modal.firstElementChild.classList.remove('scale-95'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        document.getElementById('expenseForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const editId = document.getElementById('editId').value;
            
            const payload = {
                action: editId ? "update" : "create",
                id: editId,
                date: document.getElementById('date').value,
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                amount: parseFloat(document.getElementById('amount').value),
                wallet: document.getElementById('wallet').value,
                note: document.getElementById('note').value
            };

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> กำลังบันทึก...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.result === "success") {
                    closeModal();
                    await fetchData();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert("บันทึกไม่สำเร็จ: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกรายการ';
            }
        };

        async function deleteItem(id) {
            if (!confirm('⚠️ ยืนยันการลบรายการนี้ใช่หรือไม่?')) return;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "delete", id: id })
                });
                const result = await response.json();
                if(result.result === "success") {
                    fetchData();
                } else {
                    alert("ลบไม่สำเร็จ: " + result.message);
                }
            } catch (error) {
                alert("ลบไม่สำเร็จ");
            }
        }

        function editItem(id) {
            openModal(id);
        }

        window.onload = () => {
            generateMonthOptions();
            fetchData();
        };
    </script>
</body>
</html>
